name: Build Winlator VR APK
# Этот файл сам вносит патч Winlator VR в исходники и собирает APK.
# Запуск: вкладка Actions -> "Build Winlator VR APK" -> Run workflow.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply Winlator VR patch
        run: |
          set -e
          mkdir -p app/src/main/java/com/winlator/vrbridge
          cat > app/src/main/java/com/winlator/vrbridge/VRBridgeServer.java <<'VRB_SERVER_EOF'
          package com.winlator.vrbridge;

          import android.util.Log;

          import com.winlator.renderer.GLRenderer;
          import com.winlator.winhandler.MouseEventFlags;
          import com.winlator.winhandler.WinHandler;
          import com.winlator.xserver.Pointer;
          import com.winlator.xserver.XKeycode;
          import com.winlator.xserver.XServer;

          import java.io.DataInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.InetAddress;
          import java.net.InetSocketAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicBoolean;

          /**
           * Мост «Winlator VR»: отдаёт кадры экрана X по TCP (127.0.0.1) и принимает мышь/клавиатуру.
           * Клиент — VR-эмулятор на Godot. Протокол (все числа little-endian):
           *
           * сервер -> клиент
           *   при подключении: 'W','V','R','1', u16 ширина, u16 высота, u8 флаги (0)
           *   0x01 кадр:  u16 ширина, u16 высота, u32 длина, RGBA8 (длина = ширина*высота*4), строки сверху вниз
           *   0x02 текст: u16 длина, UTF-8 (например "guest_exit")
           * клиент -> сервер
           *   0x01 мышь абсолютно: i16 x, i16 y (в пикселях экрана X)
           *   0x02 кнопка мыши:    u8 кнопка (1 левая, 2 правая, 3 средняя), u8 нажата
           *   0x03 клавиша:        u8 нажата, u8 код XKeycode.id
           *   0x04 мышь относительно: i16 dx, i16 dy
           *   0x05 колесо:         i8 (+1 вверх, -1 вниз)
           *   0x06 выход:          без данных
           */
          public class VRBridgeServer implements GLRenderer.FrameSink {
              public static final int PORT = 47831;
              private static final String TAG = "VRBridge";
              private static final int MIN_FRAME_INTERVAL_MS = 33;
              private static final VRBridgeServer INSTANCE = new VRBridgeServer();
              private static final XKeycode[] KEYCODE_BY_ID = new XKeycode[256];

              static {
                  for (XKeycode keycode : XKeycode.values()) KEYCODE_BY_ID[keycode.id & 0xff] = keycode;
              }

              public static VRBridgeServer get() {
                  return INSTANCE;
              }

              private XServer xServer;
              private GLRenderer renderer;
              private ServerSocket serverSocket;
              private volatile Socket client;
              private volatile boolean running = false;
              private final AtomicBoolean sending = new AtomicBoolean(false);
              private final ExecutorService sender = Executors.newSingleThreadExecutor();
              private final Object writeLock = new Object();
              private byte[] frameBytes = new byte[0];
              private volatile long lastFrameMs = 0;

              public synchronized void start(XServer xServer, GLRenderer renderer) {
                  stop();
                  this.xServer = xServer;
                  this.renderer = renderer;
                  running = true;
                  renderer.setFrameSink(this);

                  Thread acceptThread = new Thread(this::acceptLoop, "vrbridge-accept");
                  acceptThread.setDaemon(true);
                  acceptThread.start();
              }

              public synchronized void stop() {
                  running = false;
                  if (renderer != null) renderer.setFrameSink(null);
                  closeClient();
                  try {
                      if (serverSocket != null) serverSocket.close();
                  }
                  catch (IOException ignored) {}
                  serverSocket = null;
                  renderer = null;
                  xServer = null;
              }

              /** Остановить после отправки уже поставленных в очередь сообщений. */
              public void shutdownLater() {
                  sender.execute(this::stop);
              }

              public void sendText(String text) {
                  final Socket socket = client;
                  if (socket == null) return;
                  final byte[] utf8 = text.getBytes(StandardCharsets.UTF_8);
                  sender.execute(() -> {
                      try {
                          ByteBuffer header = ByteBuffer.allocate(3).order(ByteOrder.LITTLE_ENDIAN);
                          header.put((byte)0x02).putShort((short)utf8.length);
                          synchronized (writeLock) {
                              OutputStream out = socket.getOutputStream();
                              out.write(header.array());
                              out.write(utf8);
                              out.flush();
                          }
                      }
                      catch (IOException e) {
                          closeClient();
                      }
                  });
              }

              private void acceptLoop() {
                  try {
                      ServerSocket server = new ServerSocket();
                      server.setReuseAddress(true);
                      server.bind(new InetSocketAddress(InetAddress.getByName("127.0.0.1"), PORT));
                      serverSocket = server;

                      while (running) {
                          Socket socket = server.accept();
                          socket.setTcpNoDelay(true);
                          closeClient();
                          client = socket;
                          sendHello(socket);

                          Thread readThread = new Thread(() -> readLoop(socket), "vrbridge-read");
                          readThread.setDaemon(true);
                          readThread.start();
                      }
                  }
                  catch (IOException e) {
                      if (running) Log.e(TAG, "accept: " + e);
                  }
              }

              private void sendHello(Socket socket) throws IOException {
                  XServer server = xServer;
                  int width = server != null ? server.screenInfo.width : 0;
                  int height = server != null ? server.screenInfo.height : 0;
                  ByteBuffer hello = ByteBuffer.allocate(9).order(ByteOrder.LITTLE_ENDIAN);
                  hello.put((byte)'W').put((byte)'V').put((byte)'R').put((byte)'1');
                  hello.putShort((short)width).putShort((short)height).put((byte)0);
                  synchronized (writeLock) {
                      OutputStream out = socket.getOutputStream();
                      out.write(hello.array());
                      out.flush();
                  }
              }

              private void closeClient() {
                  Socket socket = client;
                  client = null;
                  if (socket != null) {
                      try {
                          socket.close();
                      }
                      catch (IOException ignored) {}
                  }
              }

              // ------------------------------------------------------------ кадры (поток GL)

              @Override
              public boolean wantsFrame() {
                  return client != null && !sending.get() && (System.currentTimeMillis() - lastFrameMs) >= MIN_FRAME_INTERVAL_MS;
              }

              @Override
              public void onFrame(ByteBuffer rgba, int width, int height) {
                  final Socket socket = client;
                  if (socket == null) return;

                  int stride = width * 4;
                  int length = stride * height;
                  if (frameBytes.length != length) frameBytes = new byte[length];

                  // glReadPixels отдаёт строки снизу вверх — переворачиваем
                  for (int y = 0; y < height; y++) {
                      rgba.position((height - 1 - y) * stride);
                      rgba.get(frameBytes, y * stride, stride);
                  }
                  rgba.clear();

                  lastFrameMs = System.currentTimeMillis();
                  sending.set(true);

                  final byte[] data = frameBytes;
                  final int frameWidth = width;
                  final int frameHeight = height;
                  sender.execute(() -> {
                      try {
                          ByteBuffer header = ByteBuffer.allocate(9).order(ByteOrder.LITTLE_ENDIAN);
                          header.put((byte)0x01).putShort((short)frameWidth).putShort((short)frameHeight).putInt(data.length);
                          synchronized (writeLock) {
                              OutputStream out = socket.getOutputStream();
                              out.write(header.array());
                              out.write(data);
                              out.flush();
                          }
                      }
                      catch (IOException e) {
                          closeClient();
                      }
                      finally {
                          sending.set(false);
                      }
                  });
              }

              // ------------------------------------------------------------ ввод

              private void readLoop(Socket socket) {
                  try {
                      InputStream in = socket.getInputStream();
                      DataInputStream data = new DataInputStream(in);
                      while (running && socket == client) {
                          int type = data.readUnsignedByte();
                          XServer server = xServer;
                          if (server == null) break;

                          switch (type) {
                              case 0x01: {
                                  int x = readShort(data);
                                  int y = readShort(data);
                                  server.injectPointerMove(x, y);
                                  break;
                              }
                              case 0x02: {
                                  int button = data.readUnsignedByte();
                                  boolean pressed = data.readUnsignedByte() != 0;
                                  Pointer.Button pointerButton = button == 2 ? Pointer.Button.BUTTON_RIGHT : (button == 3 ? Pointer.Button.BUTTON_MIDDLE : Pointer.Button.BUTTON_LEFT);
                                  if (pressed) server.injectPointerButtonPress(pointerButton);
                                  else server.injectPointerButtonRelease(pointerButton);
                                  break;
                              }
                              case 0x03: {
                                  boolean pressed = data.readUnsignedByte() != 0;
                                  int id = data.readUnsignedByte();
                                  XKeycode keycode = KEYCODE_BY_ID[id];
                                  if (keycode != null && keycode != XKeycode.KEY_NONE) {
                                      if (pressed) server.injectKeyPress(keycode);
                                      else server.injectKeyRelease(keycode);
                                  }
                                  break;
                              }
                              case 0x04: {
                                  int dx = readShort(data);
                                  int dy = readShort(data);
                                  WinHandler winHandler = server.getWinHandler();
                                  if (server.isRelativeMouseMovement() && winHandler != null) winHandler.mouseEvent(MouseEventFlags.MOVE, dx, dy, 0);
                                  else server.injectPointerMoveDelta(dx, dy);
                                  break;
                              }
                              case 0x05: {
                                  int direction = data.readByte();
                                  Pointer.Button wheel = direction >= 0 ? Pointer.Button.BUTTON_SCROLL_UP : Pointer.Button.BUTTON_SCROLL_DOWN;
                                  server.injectPointerButtonPress(wheel);
                                  server.injectPointerButtonRelease(wheel);
                                  break;
                              }
                              case 0x06:
                                  return;
                              default:
                                  Log.w(TAG, "unknown message " + type);
                                  return;
                          }
                      }
                  }
                  catch (IOException e) {
                      // клиент отключился
                  }
                  finally {
                      if (socket == client) closeClient();
                  }
              }

              private static int readShort(DataInputStream data) throws IOException {
                  int low = data.readUnsignedByte();
                  int high = data.readUnsignedByte();
                  return (short)(low | (high << 8));
              }
          }
          VRB_SERVER_EOF
          cat > app/src/main/java/com/winlator/vrbridge/VRLaunchActivity.java <<'VRB_LAUNCH_EOF'
          package com.winlator.vrbridge;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.widget.Toast;

          import com.winlator.MainActivity;
          import com.winlator.XServerDisplayActivity;
          import com.winlator.container.Container;
          import com.winlator.container.ContainerManager;
          import com.winlator.xenvironment.RootFS;

          import java.util.ArrayList;

          /**
           * Точка входа для VR-эмулятора: winlatorvr://launch?exe=<путь>&container=<id>&ret=<пакет>
           * Запускает игру в контейнере Winlator и включает мост (кадры/ввод по TCP).
           */
          public class VRLaunchActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Uri uri = getIntent().getData();
                  String exe = uri != null ? uri.getQueryParameter("exe") : null;
                  String containerParam = uri != null ? uri.getQueryParameter("container") : null;
                  String returnPackage = uri != null ? uri.getQueryParameter("ret") : null;

                  RootFS rootFS = RootFS.find(this);
                  if (!rootFS.isValid()) {
                      Toast.makeText(this, "Сначала открой Winlator и дождись установки системы (rootfs)", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(this, MainActivity.class));
                      finish();
                      return;
                  }

                  ContainerManager containerManager = new ContainerManager(this);
                  ArrayList<Container> containers = containerManager.getContainers();
                  if (containers.isEmpty()) {
                      Toast.makeText(this, "В Winlator нет контейнеров — создай контейнер", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(this, MainActivity.class));
                      finish();
                      return;
                  }

                  Container container = containers.get(0);
                  if (containerParam != null) {
                      try {
                          Container requested = containerManager.getContainerById(Integer.parseInt(containerParam));
                          if (requested != null) container = requested;
                      }
                      catch (NumberFormatException ignored) {}
                  }

                  Intent intent = new Intent(this, XServerDisplayActivity.class);
                  intent.putExtra("container_id", container.id);
                  if (exe != null && !exe.isEmpty()) intent.putExtra("exec_path", exe);
                  intent.putExtra("vr_bridge", true);
                  if (returnPackage != null && !returnPackage.isEmpty()) intent.putExtra("vr_return_package", returnPackage);
                  startActivity(intent);
                  finish();
              }
          }
